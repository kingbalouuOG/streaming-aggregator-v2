name: Fingerprint diagnostic (TEMPORARY — delete before merge)

# Throwaway: fingerprints one commit in the states eas update and the Gradle
# build see, so the source lists can be diffed. Never tags, never submits.

on:
  push:
    branches: ['fix/android-ota-fingerprint']
    paths: ['.github/workflows/fingerprint-diag.yml']

jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install native deps
        working-directory: native
        run: npm install

      - name: A — clean checkout, expo-updates fingerprint:generate
        working-directory: native
        run: |
          mkdir -p /tmp/fp
          npx expo-updates fingerprint:generate --platform android --debug > /tmp/fp/a-clean.json
          jq -r .hash /tmp/fp/a-clean.json

      - name: B — clean checkout, eas-cli runtime (what eas update does)
        working-directory: native
        continue-on-error: true
        run: |
          npx eas-cli@22 fingerprint:generate --platform android --environment production --non-interactive --json > /tmp/fp/b-eas.json || true
          head -c 400 /tmp/fp/b-eas.json; echo

      - name: Recreate native/.env (same as android-release.yml)
        working-directory: native
        run: |
          {
            echo "EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}"
            echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}"
            echo "EXPO_PUBLIC_API_PROXY_URL=${{ secrets.EXPO_PUBLIC_API_PROXY_URL }}"
          } > .env

      - name: A2 — .env present, before prebuild
        working-directory: native
        run: |
          npx expo-updates fingerprint:generate --platform android --debug > /tmp/fp/a2-env.json
          jq -r .hash /tmp/fp/a2-env.json

      - name: Prebuild Android (same as android-release.yml)
        working-directory: native
        run: npx expo prebuild --platform android --no-install

      - name: C — after prebuild, expo-updates fingerprint:generate
        working-directory: native
        run: |
          npx expo-updates fingerprint:generate --platform android --debug > /tmp/fp/c-prebuilt.json
          jq -r .hash /tmp/fp/c-prebuilt.json

      - name: D — after prebuild, the real Gradle task
        working-directory: native/android
        run: |
          ./gradlew :app:createReleaseUpdatesResources --no-daemon -q > /tmp/fp/d-gradle.log 2>&1 || { tail -50 /tmp/fp/d-gradle.log; exit 1; }
          find app/build -name fingerprint -path '*Updates*' -o -name fingerprint -path '*updates*' | head
          F="$(find app/build -type f -name fingerprint | head -1)"; echo "gradle fingerprint: $(cat "$F")"
          grep -m1 '"sources"' /tmp/fp/d-gradle.log > /tmp/fp/d-gradle.json || true

      - name: Diff source lists
        run: |
          cd /tmp/fp
          for f in a-clean a2-env c-prebuilt d-gradle; do
            [ -s $f.json ] || continue
            echo "$f hash: $(jq -r .hash $f.json)"
            jq -r '.sources[] | "\(.type) \(.filePath // .id) \(.hash)"' $f.json | sort > $f.txt
          done
          for f in a2-env c-prebuilt d-gradle; do
            [ -s $f.txt ] || continue
            echo "===== a-clean vs $f ====="; diff a-clean.txt $f.txt || true
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fingerprint-diag
          path: /tmp/fp
