name: Fingerprint diagnostic (TEMPORARY — delete before merge)

# Throwaway proof job: fingerprints this commit exactly the way ota-update.yml
# now does before publishing (eas-cli fingerprint:generate, EAS production
# environment, clean checkout). Publishes nothing, never tags, never submits.

on:
  push:
    branches: ['fix/android-ota-fingerprint']
    paths: ['.github/workflows/fingerprint-diag.yml']

jobs:
  ota-side:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install native deps
        working-directory: native
        run: npm install
      - name: Fingerprint as ota-update.yml does (android + ios)
        working-directory: native
        run: |
          set -euo pipefail
          for p in android ios; do
            npx eas-cli@22 fingerprint:generate --platform $p --environment production --non-interactive --json > /tmp/fp-$p.raw
            echo "$p runtime (eas-cli, clean checkout): $(sed -n '/^{/,$p' /tmp/fp-$p.raw | jq -r .hash)"
          done
