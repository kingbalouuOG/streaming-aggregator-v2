name: iOS Release (EAS build → TestFlight)

# Builds the iOS app on EAS Build (cloud macOS), triggered from a Linux
# runner, then — ON A VERSION TAG — submits it to TestFlight via `eas submit`.
# Running from Linux (not Windows) is required: eas-cli can't create the
# src/lib + src/assets junction symlinks in the upload tarball on Windows
# (EPERM). On Linux the postinstall recreates those as real symlinks, so the
# upload to EAS succeeds. The iOS distribution cert + provisioning profile
# AND the App Store Connect API key are already stored on EAS (created during
# the first manual `eas submit`), so CI needs no Apple login and no .p8.
#
# Triggers:
#   • push a tag `v*`  (e.g. `git tag v2.0.2 && git push --tags`) → build + submit to TestFlight
#   • manual "Run workflow"                                        → build-only (no submit)
#   • manual "Run workflow" with `submit: true`                    → build + submit to TestFlight
#   • manual "Run workflow" with `profile: preview`                → ad-hoc build, install link, no TestFlight
#
# The `submit` input exists so an iOS-only TestFlight build can be cut
# WITHOUT tagging. A `v*` tag also fires android-release.yml, which submits
# the AAB to Google Play — coupling the two platforms into one publish. When
# only an iOS test build is wanted, dispatch this workflow with submit: true.
#
# Required repository secret:
#   EXPO_TOKEN   Expo access token (expo.dev → Account → Settings → Access tokens)
# Also required (one-time, already set): the EAS "production" environment
#   variables (EXPO_PUBLIC_*), and the EAS-stored iOS cert + ASC API key.
#
# WHY AN AD-HOC BUILD ALSO HAS TO RUN HERE, NOT LOCALLY: on Windows eas-cli
# fails to package the junction tree when building the upload tarball, with
# "EPERM: operation not permitted, symlink" on src/assets. The preview profile
# hits this exactly as production does. Device registration
# (eas device:create) DOES work from Windows — it never builds a tarball.

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile — preview = ad-hoc, installs from a link'
        type: choice
        options: [production, preview]
        default: production
      submit:
        description: 'Submit to TestFlight (production profile only)'
        type: boolean
        default: false
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      # A tag push carries no inputs, so this falls back to production and the
      # release path is unchanged.
      EAS_PROFILE: ${{ inputs.profile || 'production' }}
    steps:
      - name: Checkout (full repo — native/ depends on ../src/lib)
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install native deps (postinstall makes ../src/lib + ../src/assets real symlinks)
        working-directory: native
        run: npm install

      - name: EAS build (iOS) — runs on EAS, waits for the .ipa
        working-directory: native
        run: npx eas-cli@latest build --platform ios --profile "$EAS_PROFILE" --non-interactive

      # An ad-hoc build is installed from a link rather than TestFlight, so the
      # link IS the deliverable. Put it in the run summary rather than making
      # someone dig it out of expo.dev.
      - name: Surface the install link (ad-hoc builds)
        if: env.EAS_PROFILE == 'preview'
        working-directory: native
        run: |
          set -euo pipefail
          BUILD_ID="$(npx eas-cli@latest build:list --platform ios --limit 1 --json --non-interactive | jq -r '.[0].id')"
          URL="https://expo.dev/accounts/kingbalouu/projects/videx/builds/$BUILD_ID"
          {
            echo "## Install on device"
            echo
            echo "Open on the iPhone **in Safari** and tap Install:"
            echo
            echo "$URL"
            echo
            echo "Delete the existing Videx app first — updating over it keeps the"
            echo "MMKV cache, which invalidates a cold-open measurement."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "install page: $URL"

      # Submit to TestFlight on a version tag, or on a manual run that opted in
      # via the `submit` input. Default-false keeps a bare manual run build-only.
      # Uses the App Store Connect API key already stored on EAS, so there is no
      # .p8 in the repo and no Apple login here — just EXPO_TOKEN.
      #
      # NOTE: `buildNumber` in app.json must be unique per version string —
      # App Store Connect rejects a duplicate outright. Bump it before any run
      # that submits.
      - name: Submit to TestFlight
        if: startsWith(github.ref, 'refs/tags/v') || (inputs.submit && inputs.profile == 'production')
        working-directory: native
        run: npx eas-cli@latest submit --platform ios --latest --profile production --non-interactive
