name: Android Release (AAB)

# Builds the signed production Android App Bundle on a clean Linux runner
# (this sidesteps the Windows-local problems: the CMake/ninja "build.ninja
# still dirty" regeneration loop, and eas-cli's inability to package the
# junction-based shared tree — symlink EPERM). Then, ON A VERSION TAG, it
# submits the AAB to Google Play's internal testing track.
#
# Triggers:
#   • push a tag `v*`  (e.g. `git tag v2.0.2 && git push --tags`) → build + submit to Play
#   • manual "Run workflow"                                        → build-only (artifacts, no submit)
#   • manual "Run workflow" with `submit: true`                    → build + submit to Play internal
#
# The `submit` input exists because a tag re-run uses the workflow file
# FROM THE TAG'S COMMIT, so a CI fix merged to main cannot be applied by
# re-running an existing tag — and moving the tag would rebuild iOS under
# a build number App Store Connect has already accepted, which it rejects
# as a duplicate. This lets a fixed Android build ship for a tag that has
# already been cut.
#
# Artifacts from every run: `videx-release-aab` (Play upload format, NOT
# installable on a device) and `videx-release-apk` (universal, sideload
# with `adb install -r` for on-device testing).
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64       base64 of the upload keystore (videx-release, 99:CE:FF:7E)
#   VIDEX_UPLOAD_STORE_PASSWORD   keystore store password
#   VIDEX_UPLOAD_KEY_PASSWORD     key password (alias videx-key)
#   EXPO_PUBLIC_SUPABASE_URL      } public client config (EXPO_PUBLIC_*),
#   EXPO_PUBLIC_SUPABASE_ANON_KEY }  inlined into the JS bundle at build time
#   EXPO_PUBLIC_API_PROXY_URL     }
#   EXPO_PUBLIC_SENTRY_DSN        } (empty/unset = Sentry SDK stays disabled)
#   PLAY_SERVICE_ACCOUNT_JSON     Google Play service-account JSON (raw file contents) — submit step

on:
  workflow_dispatch:
    inputs:
      submit:
        description: 'Submit the AAB to Google Play (internal testing track)'
        type: boolean
        default: false
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full repo — native/ depends on ../src/lib)
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install native deps (postinstall symlinks ../src/lib into native/)
        working-directory: native
        run: npm install

      - name: Recreate native/.env (public EXPO_PUBLIC_* values)
        working-directory: native
        run: |
          {
            echo "EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}"
            echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}"
            echo "EXPO_PUBLIC_API_PROXY_URL=${{ secrets.EXPO_PUBLIC_API_PROXY_URL }}"
            echo "EXPO_PUBLIC_SENTRY_DSN=${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}"
          } > .env

      - name: Restore upload keystore (path the signing plugin expects)
        run: |
          mkdir -p "$HOME/Documents/Code"
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$HOME/Documents/Code/videx-release"
          test -s "$HOME/Documents/Code/videx-release" || { echo "::error::keystore empty — is ANDROID_KEYSTORE_BASE64 set?"; exit 1; }

      - name: Prebuild Android (injects release signing via the config plugin)
        working-directory: native
        run: npx expo prebuild --platform android --no-install

      - name: Build signed release AAB
        working-directory: native/android
        env:
          ORG_GRADLE_PROJECT_VIDEX_UPLOAD_STORE_PASSWORD: ${{ secrets.VIDEX_UPLOAD_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_VIDEX_UPLOAD_KEY_PASSWORD: ${{ secrets.VIDEX_UPLOAD_KEY_PASSWORD }}
          # Sentry release sourcemap upload: the expo plugin wires a
          # SentryUpload gradle task into bundleRelease; without this token
          # sentry-cli exits 1 and FAILS the whole build (seen on the first
          # 2.1.0 smoke run). If the token is ever removed, set
          # SENTRY_DISABLE_AUTO_UPLOAD=true here instead.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          # Android Lint's `lintVital*` tasks run as part of a release build
          # and load every module's classes to analyse them. Adding
          # expo-updates pushed that over the default Metaspace cap:
          #
          #   java.lang.OutOfMemoryError: Metaspace
          #   > Task :expo-updates:lintVitalAnalyzeRelease FAILED
          #
          # Metaspace holds class metadata and is NOT governed by -Xmx, so a
          # bigger heap would not have helped. Raised here rather than in
          # app.json because android/ is generated by prebuild; appended
          # last so it wins over the template's value.
          #
          # Heap is kept moderate on purpose: the first failure of this build
          # was the daemon being OS-killed outright, so claiming too much is
          # its own failure mode.
          {
            echo ""
            echo "# CI override — see the workflow comment on this step."
            echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8"
            echo "kotlin.daemon.jvmargs=-Xmx2g"
          } >> gradle.properties
          tail -4 gradle.properties
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Verify signing fingerprint (expect SHA256 99:CE:FF:7E…)
        run: keytool -printcert -jarfile native/android/app/build/outputs/bundle/release/app-release.aab | grep -iA1 'SHA256'

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: videx-release-aab
          path: native/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      # An .aab cannot be installed on a device — it is a publishing format
      # that Play unpacks into per-device split APKs. Getting a build onto a
      # handset otherwise means tagging a release, which publishes. So also
      # emit a universal APK: same upload key, directly `adb install`-able,
      # and cheap here because bundleRelease has already produced the JS
      # bundle and compiled the native libs in this same Gradle project.
      #
      # It is universal (every ABI and density) where Play would ship a
      # slimmer split, so install size is not representative — but the JS
      # bundle, the native libs actually loaded at runtime and the network
      # path are identical, so cold-open timing measured off it is fair.
      #
      # Sequenced AFTER the AAB upload on purpose: the AAB is the release
      # artifact and must not be put at risk by a step that exists only for
      # device testing.
      - name: Build sideloadable universal APK
        working-directory: native/android
        env:
          ORG_GRADLE_PROJECT_VIDEX_UPLOAD_STORE_PASSWORD: ${{ secrets.VIDEX_UPLOAD_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_VIDEX_UPLOAD_KEY_PASSWORD: ${{ secrets.VIDEX_UPLOAD_KEY_PASSWORD }}
          # assembleRelease pulls in the same SentryUpload task as
          # bundleRelease; without the token sentry-cli exits 1 and fails
          # the build. Same reasoning as the AAB step above.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      # NOT keytool: `-printcert -jarfile` reads only a v1 (JAR) signature,
      # and these release APKs carry APK Signature Scheme v2/v3 only. keytool
      # finds nothing, prints nothing, and the grep exits 1 — which is exactly
      # how the first run of this step failed. apksigner understands v2/v3.
      #
      # Asserts the digest rather than merely printing it, so a wrong signing
      # key fails the build instead of scrolling past in the log. The expected
      # value is the upload key, confirmed against the AAB in run 33056536749:
      #   SHA256: 99:CE:FF:7E:70:01:19:F5:...:18:41:4C:57
      # apksigner prints it as unseparated lowercase hex, hence the prefix form.
      - name: Verify APK is signed with the same key as the AAB
        run: |
          set -euo pipefail
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          echo "using $APKSIGNER"
          "$APKSIGNER" verify --print-certs             native/android/app/build/outputs/apk/release/app-release.apk | tee /tmp/apk-certs.txt
          grep -iq 'SHA-256 digest: 99ceff7e700119f5' /tmp/apk-certs.txt || {
            echo "::error::APK is not signed with the expected upload key (SHA256 99:CE:FF:7E…)"
            exit 1
          }

      - name: Upload APK artifact (sideload for device testing)
        uses: actions/upload-artifact@v4
        with:
          name: videx-release-apk
          path: native/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # Submit to Google Play — ONLY on a version tag (manual runs stay build-only).
      - name: Submit to Google Play (internal testing track)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.submit
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.videx.streaming
          releaseFiles: native/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
