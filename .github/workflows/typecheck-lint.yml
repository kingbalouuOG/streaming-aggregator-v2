name: Typecheck

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # native/ lints with the root's pinned ESLint and plugins (see
      # native/eslint.config.mjs), so the root `npm ci` above is all it needs.
      # No native install: the result is identical without native/node_modules.
      - name: Lint (native)
        working-directory: native
        run: npm run lint

      - name: Test (vitest)
        run: npm test
